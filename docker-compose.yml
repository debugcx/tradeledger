services:
  tradeledger:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradeledger:latest
    container_name: tradeledger
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      TZ: ${TZ:-Asia/Shanghai}
      SEED_DEMO: ${SEED_DEMO:-0}
      TRADELEDGER_PASSWORD: ${TRADELEDGER_PASSWORD:?请在 .env 中设置 TRADELEDGER_PASSWORD}
      TRADELEDGER_MASTER_KEY: ${TRADELEDGER_MASTER_KEY:?请在 .env 中设置 TRADELEDGER_MASTER_KEY}
    volumes:
      - ./data:/app/data
    expose:
      - "8790"
    # 仅调试时可临时打开：
    # ports:
    #   - "127.0.0.1:8790:8790"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: tradeledger-caddy
    restart: unless-stopped
    depends_on:
      tradeledger:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TRADELEDGER_DOMAIN: ${TRADELEDGER_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
